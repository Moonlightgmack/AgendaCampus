<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}{{ NOM_APPLICATION }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <header class="entete">
    <div class="conteneur entete__barre">
      <a class="logo" href="/">{{ NOM_APPLICATION }}</a>
      <nav aria-label="Navigation principale">
        <ul class="menu">
          <li><a href="/">Événements</a></li>
          <li><a href="/evenements/nouveau">Créer un événement</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="contenu" class="conteneur">
    {% block contenu %}{% endblock %}
  </main>

  <footer class="pied">
    <div class="conteneur">
      <p>{{ NOM_APPLICATION }}, Université Adventiste Cosendai · Projet pédagogique « Conception Web 1 »</p>
    </div>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
