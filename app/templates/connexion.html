{% extends "base.html" %}
{% block titre %}Connexion | {{ NOM_APPLICATION }}{% endblock %}

{% block contenu %}
<h1>Espace organisateur</h1>
<form class="panneau panneau--etroit" method="post" action="/connexion">
  {% if erreur %}<p class="alerte alerte--erreur" role="alert">{{ erreur }}</p>{% endif %}
  <input type="hidden" name="suivant" value="{{ suivant }}">
  <div class="champ">
    <label for="email">Adresse e-mail</label>
    <input id="email" name="email" type="email" required autocomplete="username" value="{{ email }}">
  </div>
  <div class="champ">
    <label for="mot_de_passe">Mot de passe</label>
    <input id="mot_de_passe" name="mot_de_passe" type="password" required autocomplete="current-password">
  </div>
  <button type="submit" class="bouton">Se connecter</button>
  <p>Pas encore de compte ? <a href="/compte/creer">Créer un compte organisateur</a></p>
</form>
{% endblock %}
